        /* Optimizaciones a nivel de Body y Scroll */

        @keyframes liquidMove {
            0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }

            mask-image: linear-gradient(to bottom, black calc(100% - 350px), transparent 100%);

        }
        
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========================================== */

        ];

        // Elementos DOM
        const container = document.getElementById('project-modules');
        const heroTitle = document.getElementById('hero-title');
        const form = document.getElementById('co-proposal-form');
        const submitBtn = form?.querySelector('button[type="submit"]');
        const feedback = document.getElementById('co-form-feedback');
        
        // Elementos IA

        const aiPopover = document.getElementById('ai-settings-popover');
        const aiClose = document.getElementById('ai-close-popover');
        const aiRun = document.getElementById('ai-run-btn');
        const aiError = document.getElementById('ai-error-msg');

        const aiCustom = document.getElementById('co-ai-instruction');
        const aiLoading = document.getElementById('co-ai-loading');

        // Renderizado DOM Ultra-rápido (Performance SEO)
        function initGallery() {
            if (!container) return;
            
            // Usamos map y join para inyectar todo como un solo bloque HTML (O(n) optimizado)
            const htmlString = behanceImages.map((item, i) => {
                const isFirst = i === 0;
                const isLast = i === behanceImages.length - 1;
                let extraClasses = '';
                
                if (isFirst) extraClasses = 'gallery-mask-top';
                if (isLast) extraClasses = 'gallery-mask-bottom';

                // Solo damos prioridad de red a la primera imagen (LCP Optimization)
                const priorityAttr = isFirst ? 'fetchpriority="high"' : '';
                // 'decoding="async"' previene que pintar la imagen congele la página (Performance)
                // NUEVO: Agregada clase protected-media y draggable="false"
                return `
                    <section class="flex flex-col m-0 p-0 leading-[0] relative bg-transparent ${extraClasses}">
                        <img src="${item.url}" alt="${item.alt}" ${priorityAttr} decoding="async" draggable="false" class="block w-full h-auto border-none m-0 p-0 align-bottom -mb-[1px] protected-media" />
                    </section>
                `;
            }).join('');
            
            container.innerHTML = htmlString;
        }

        // Configuración Lenis Scroll de Alta Fluidez
        function initSmoothScroll() {
            const lenis = new Lenis({
                duration: 1.2,
                easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)), 
                direction: 'vertical',
                gestureDirection: 'vertical',
                smooth: true,
                mouseMultiplier: 1,
                smoothTouch: false,
                touchMultiplier: 2,
            });

            function raf(time) {
                lenis.raf(time);
                requestAnimationFrame(raf);
            }
            requestAnimationFrame(raf);

            // Parallax ligero (Solo transformaciones GPU-friendly)
            if (heroTitle) {
                lenis.on('scroll', (e) => {
                    const scrollY = e.animatedScroll;
                    if (scrollY < 800) {
                        const opacity = Math.max(0, 1 - (scrollY / 600));
                        const translateY = scrollY * 0.3;
                        const scale = Math.max(0.85, 1 - (scrollY * 0.0003));
                        
                        heroTitle.style.opacity = opacity;
                        heroTitle.style.transform = `translate3d(0, ${translateY}px, 0) scale(${scale})`;
                    }
                });
            }
        }

        // Lógica de UI para IA
        let popoverTimer;

        function showPopover() {
            clearTimeout(popoverTimer);
            aiPopover.classList.remove('hidden');
            aiPopover.classList.add('flex');
            requestAnimationFrame(() => {
                aiPopover.classList.remove('opacity-0', 'translate-y-2');
                aiPopover.classList.add('opacity-100', 'translate-y-0');
            });
        }

        function hidePopover() {
            aiPopover.classList.remove('opacity-100', 'translate-y-0');
            aiPopover.classList.add('opacity-0', 'translate-y-2');
            popoverTimer = setTimeout(() => {
                aiPopover.classList.remove('flex');
                aiPopover.classList.add('hidden');
            }, 300);
        }

        if (aiTrigger) {
            aiTrigger.addEventListener('click', () => {
                if (aiInput.value.trim().length < 5) {
                    aiError.textContent = "⚠️ Escribe primero una idea básica en el área de texto.";
                    aiError.classList.remove('hidden');
                    aiInput.focus();
                } else {
                    aiError.classList.add('hidden');
                }
                showPopover();
            });
        }

        if (aiClose) aiClose.addEventListener('click', hidePopover);

        if (aiRun) {
            aiRun.addEventListener('click', async () => {
                const prompt = aiInput.value.trim();
                const config = aiCustom.value.trim();
                
                hidePopover();
                aiLoading.classList.remove('hidden');
                aiLoading.classList.add('flex');

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Idea original: "${prompt}". Tono extra: "${config}"` }] }],
                            systemInstruction: { 
                                parts: [{ text: "Actúa como el cliente de una agencia de diseño. Redacta una solicitud clara, profesional y en primera persona mejorando la idea original. No uses comillas." }] 
                            }
                        })
                    });
                    
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content) {
                        aiInput.value = data.candidates[0].content.parts[0].text;
                    }
                } catch (error) {
                    aiError.textContent = "Error de conexión con la IA.";
                    aiError.classList.remove('hidden');
                    showPopover();
                } finally {
                    aiLoading.classList.add('hidden');
                    aiLoading.classList.remove('flex');
                }
            });
        }

        // Lógica de Envío de Formulario
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<div class="spinner w-4 h-4 border-2 border-black/20 border-t-black rounded-full mr-2"></div> Enviando...';
                submitBtn.disabled = true;
                
                feedback.classList.add('hidden');
                feedback.className = "hidden md:col-span-2 p-4 rounded-lg text-sm font-semibold text-center mt-4"; 

                try {
                    const res = await fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    if (res.ok) {
                        feedback.textContent = "¡Propuesta enviada con éxito! Revisaré mi bandeja pronto.";
                        feedback.classList.add('block', 'bg-[#00ff88]/10', 'text-[#00ff88]', 'border', 'border-[#00ff88]/30');
                        feedback.classList.remove('hidden');
                        form.reset();
                    } else throw new Error();
                } catch (err) {
                    feedback.textContent = "Hubo un error al enviar. Por favor intenta escribirme directamente al correo.";
                    feedback.classList.add('block', 'bg-[#ff3232]/10', 'text-[#ff3232]', 'border', 'border-[#ff3232]/30');
                    feedback.classList.remove('hidden');
                } finally {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            });
        }

        // Inicializar App
        document.addEventListener('DOMContentLoaded', () => {
            initGallery();
            initSmoothScroll();
            initSecurityProtocols();
        });

        // ==========================================
        // PROTOCOLOS DE SEGURIDAD Y ANTI-SCRAPING
        // ==========================================
        function initSecurityProtocols() {
            // 1. Bloquear atajos de teclado (F12, Ver Código, Copiar, Pegar, Inspeccionar)
            document.addEventListener('keydown', (e) => {
                const blockedKeys = ['F12', 'u', 'c', 'x', 'v', 'i', 'j', 's', 'p'];
                
                // Si presiona F12, o usa Ctrl/Cmd con las teclas bloqueadas
                if (e.key === 'F12' || (e.ctrlKey && blockedKeys.includes(e.key.toLowerCase())) || (e.metaKey && blockedKeys.includes(e.key.toLowerCase()))) {
                    e.preventDefault();
                    return false;
                }
            });

            // 2. Trampa de Debugger (Congela la consola si logran abrirla)
            // Se ejecuta constantemente. Si no hay consola abierta, no pasa nada. Si la abren, pausa el navegador.
            setInterval(() => {
                (function() { return false; }['constructor']('debugger')());
            }, 100);

            // 3. Limpiar consola automáticamente y mostrar advertencia
            setInterval(() => {
                console.clear();
                console.log("%c¡Alto ahí! 🛑", "color: #00f2ff; font-size: 40px; font-weight: 900; text-shadow: 0 0 10px rgba(0,242,255,0.5); font-family: sans-serif;");
                console.log("%cEl código fuente, diseño y recursos multimedia de este portafolio están encriptados y protegidos legalmente por derechos de autor de Christian Ortiz Studio. Cualquier intento de extracción o copia será detectado.", "color: white; font-size: 14px; font-family: sans-serif; line-height: 1.5;");
            }, 2000);
            
            // 4. Prevenir arrastrar y soltar a nivel documento
            document.addEventListener('dragstart', (e) => e.preventDefault());
        }

    </script>
</body>
</html>
